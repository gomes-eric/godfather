# Padrinho — declarative server layout for the M4F1A legion (Aion 2, Triniel LATAM, Asmodian).
# Applied with `/setup`. Keys are English; display names are PT-BR.
# Every item has a stable `key`: renaming `name` never recreates the Discord object.
#
# Access levels (minimum tier): everyone | soldier | officer | commander | bot | none
#   everyone  = @everyone (includes Visitante)
#   bot       = only Padrinho may write
#   none      = nobody may write (used by #musica; slash commands still allowed)

settings:
  timezone: America/Sao_Paulo   # South America servers use São Paulo time (shugo.gg)
  community:
    enable: true
    rulesChannel: rules
    updatesChannel: officers
  afk:
    channel: afk
    timeoutSeconds: 900
  # Given and taken with /member partner (by Oficiais): friends who don't play.
  partnerRole: partner
  # Members of an allied legion (/member ally, an approved Aliança application): Aliado counts as
  # Soldado in every channel and command; each alliance adds a role named after its legion.
  allyRole: ally
  # Who left the legion in the game (daily check) or was restricted with /member restrict: sees
  # only #geral and the channels open to everyone.
  restrictedRole: restricted
  # The legion roles of the alliances (listed under `alliances` at the end of this file).
  alliances:
    color: "#5B9BD5"   # allied blue
    channel: alliance-chat
  welcome:
    channel: welcome
    autoRole: visitor
    botRole: bots            # every bot that joins gets this role instead of autoRole
    # Posted as a card; {member} mentions the newcomer, {channel:<key>} becomes a link.
    title: 🌹 Bem-vindo(a) à M4F1A!
    message: |
      {member}, que bom ter você por aqui!
      Somos uma legião **Asmodiana** do **Triniel** (Aion 2 LATAM).
    steps:
      - name: 📜 Leia as regras
        value: Tudo começa em {channel:rules}.
      - name: 🎮 Mande a sua ficha
        value: |
          Em {channel:recruitment}, escolha como quer entrar:
          ⚔️ **Membro**: já joga na M4F1A ou quer entrar nela.
          🤝 **Aliança**: é de uma legião aliada.
          💬 **Parceiro**: não joga, mas quer ficar com a gente.
      - name: ❓ Ficou com dúvida?
        value: Pergunte em {channel:visitor-qa}, a gente responde.
  # Posted (and kept up to date) by /setup in #regras. {channel:<key>} becomes a clickable link.
  rules:
    channel: rules
    title: 📜 Regras da M4F1A
    message: |
      Bem-vindo(a) à **M4F1A**, legião Asmodiana do Triniel! 🌹
      Estas regras valem aqui no Discord **e** dentro do jogo. Ao ficar no servidor, você concorda com elas.

      🎮 **Já está na legião no jogo ou quer entrar?** Mande a ficha em {channel:recruitment} com o nome do seu personagem. Ela vale para os dois casos: quem já é da M4F1A ganha o cargo aqui, e quem quer entrar é avaliado pelos Oficiais.

      ━━━━━━━━━━━━━━━━━━━━━━

      🤝 **1 · Respeito acima de tudo**
      Sem ofensas, preconceito, assédio ou provocação, seja com membros, aliados ou inimigos. Brincadeira só vale se todo mundo estiver rindo.

      ⚔️ **2 · A legião vem primeiro**
      Na Guerra do Abismo, nos Chefes e nos eventos, siga a call dos Oficiais. Confirme presença nos botões dos avisos em {channel:event-alerts} e avise se não puder ir.

      🎯 **3 · Compromisso com a atividade**
      Participe dos eventos sempre que puder. Ficar muito tempo inativo sem avisar pode levar à remoção da legião no jogo.

      💰 **4 · Loot e drops**
      Siga as regras de distribuição combinadas pelos Oficiais. Nada de pegar item fora da sua vez.

      🗂️ **5 · Cada coisa no seu canal**
      💬 Conversa em {channel:general} · 🎵 música só em {channel:music} (comandos `/`) · 📚 guias em {channel:tutorials} · 📸 prints em {channel:clips}

      🚫 **6 · Sem spam, divulgação ou golpes**
      Nada de flood, links suspeitos, venda de contas/gold ou propaganda de outros servidores.

      🔞 **7 · Conteúdo adequado**
      Nada de NSFW, gore ou qualquer coisa que viole os termos do Discord ou do Aion 2.

      🛡️ **8 · Problemas? Fale com um Oficial**
      Discussão se resolve no privado com a liderança, não no chat. Denúncias são tratadas com sigilo.

      ━━━━━━━━━━━━━━━━━━━━━━

      ⚖️ **Punições**
      Conforme a gravidade: aviso → timeout → expulsão do Discord e da legião. Casos graves vão direto para o banimento.

      🎮 Ficha para membros e novatos: {channel:recruitment} · 📅 Veja a semana em {channel:agenda}
  # Nobody changes their own nickname by hand: an approved application and the daily check set
  # it (Comandantes are not affected).
  lockNicknames: true
  # "Enviar minha ficha" (panel in #recrutamento): each application becomes a card there with
  # Aprovar/Recusar (officers and up); approving registers the character and makes them Soldado.
  recruitment:
    channel: recruitment       # the "Enviar minha ficha" form
    # Each application's card goes in a private thread here that only the applicant, Oficiais and
    # Comandantes see; the welcome on approval goes in the same thread.
    reviewChannel: recruitment
    pingRole: officer
  # Every one of the game's Steam announcements (patch notes, maintenance, events, account
  # restrictions…), read in Portuguese every 15 minutes.
  news:
    channel: news
    steamAppId: 3393110       # AION 2 on Steam
    # Claude (Sonnet) summarizes each post: only what matters to the legion, @everyone when it
    # concerns Triniel, class roles when their class changes. Needs the ANTHROPIC_* federation
    # ids in .env (Workload Identity Federation); without them the plain card goes out.
    summary:
      model: claude-sonnet-5-5
  # Templates with a shugoEvent take their days and time from https://shugo.gg/timers.json:
  # South America (Triniel), São Paulo time, checked every 6 hours. A change is written back here
  # and logged in #audit-log.
  eventTimes:
    region: global-sa
    group: 1                  # Triniel's siege group (21:00 / 21:30)
    checkHours: 6
  # Characters are read from the official Aion 2 site (the same data shugo.gg shows).
  # Triniel (South America, Asmodian side) is server 2403.
  characters:
    region: la
    serverId: 2403
    # In-game legion name: the daily check reports who left or joined it.
    legion: M4F1A
    # Once a day every registered character is re-read: new class/name → role and nickname
    # updated; left or joined the legion → reported in reportChannel. Then #ranking is rebuilt.
    reportChannel: officers
    rankingChannel: ranking
  audit:
    channel: audit-log
  musicGuard:
    channel: music
    # Jockie Music reads text commands (m!p, m!s...); messages starting with these stay.
    commandPrefixes: ["m!"]
  # Safety net for the ➕ Criar generators: new rooms per minute for the whole server (0 = no limit).
  # There is no per-person wait; leaving a room to create another just swaps them.
  voiceRooms:
    maxCreationsPerMinute: 30
  eventDefaults:
    announceChannel: event-alerts
    agendaChannel: agenda
    reminderOffsetsMinutes: [30, 0]
    ping: everyone

roles:
  # Asmodian palette: blood crimson, abyss violet, ash and steel.
  # Colors are mid-tone so names stay readable on Discord's dark theme.
  # Hierarchy (top to bottom). Fundador sits above the bot's own role; every other role below it.
  # The server owner only. Padrinho can't edit a role above its own, so /setup only warns when
  # it differs from this; the owner always counts as the commander tier, so it needs no tier.
  - key: owner
    name: Fundador
    color: "#D9485F"   # set by hand in Discord
    hoist: false
    permissions: [Administrator]
  - key: commander
    name: Comandante
    tier: commander
    color: "#D9485F"   # rose red, Asmodian crimson family
    hoist: true
    permissions: [Administrator]
  - key: officer
    name: Oficial
    tier: officer
    maxMembers: 4
    color: "#A855F7"   # abyss violet
    hoist: true
    permissions: [KickMembers, ModerateMembers, ManageMessages, ManageThreads, MoveMembers, MuteMembers]
  - key: soldier
    name: Soldado
    tier: soldier
    color: "#8B7FB8"   # dusk lavender
    hoist: true
  # Friends who don't play: they chat and hang out in voice, outside the tier ladder.
  # Channels let them in with access.asSoldier.
  # Allied legions: counts as Soldado everywhere (settings.allyRole). The legion roles of the
  # alliances sit right above it, each hoisted, so the member list groups people by legion.
  - key: ally
    name: Aliado
    color: "#5B9BD5"   # allied blue
  - key: partner
    name: Parceiro
    color: "#C98A6B"   # copper
    hoist: true
  # Left the legion in the game, or restricted by an officer: only #geral (settings.restrictedRole).
  - key: restricted
    name: Restrito
    color: "#5C5866"   # dim ash
  - key: visitor
    name: Visitante
    tier: visitor
    color: "#7D7A8C"   # ash
  # Shared role for every third-party bot (Jockie Music, Rythm, future ones).
  # Padrinho assigns it automatically to any bot that joins.
  - key: bots
    name: Bot
    color: "#6E7F99"   # steel
    hoist: true
  # Classes, given by the approved recruitment application and the daily legion check.
  # Colors follow the in-game class icons (sampled from https://sistersofmercy.altervista.org/classes/):
  # Guerreiro = blue, Batedor = green, Mago = purple, Sacerdote = pale gold.
  # Each pair uses a deeper and a lighter shade so the two classes stay distinct.
  - { key: class-gladiator,   name: Gladiador,      class: true, emoji: "⚔️", color: "#6EC6F5" }  # sky blue
  - { key: class-templar,     name: Templário,      class: true, emoji: "🛡️", color: "#4A7BD0" }  # deep blue
  - { key: class-assassin,    name: Assassino,      class: true, emoji: "🗡️", color: "#4FB286" }  # emerald
  - { key: class-ranger,      name: Arqueiro,       class: true, emoji: "🏹", color: "#8EF5B7" }  # mint
  - { key: class-sorcerer,    name: Mago,           class: true, emoji: "🔥", color: "#D291EF" }  # lilac
  - { key: class-spiritmaster, name: Espiritualista, class: true, emoji: "👻", color: "#9B59D0" }  # deep purple
  - { key: class-cleric,      name: Clérigo,        class: true, emoji: "✨", color: "#E6C46A" }  # gold
  - { key: class-chanter,     name: Encantador,     class: true, emoji: "📿", color: "#EEE6A8" }  # cream

categories:
  - key: info
    name: 📜 INFORMAÇÕES
    access: { view: everyone, write: bot }
    channels:
      - { key: rules,       type: text, name: regras }
      - { key: announcements, type: announcement, name: anuncios, access: { write: officer } }
      - { key: welcome,     type: text, name: boas-vindas }

  - key: recruitment
    name: 🤝 RECRUTAMENTO
    access: { view: everyone, write: everyone }
    channels:
      # Not a chat: the application form, and one card per application with Aprovar/Recusar.
      - { key: recruitment, type: text, name: recrutamento, access: { write: bot } }
      - { key: visitor-qa,  type: text, name: duvidas-visitantes }

  # asSoldier: roles that get what Soldado gets here; a channel's [] leaves them out.
  - key: legion
    name: 📣 M4F1A
    access: { view: soldier, write: soldier, asSoldier: [partner] }
    channels:
      # Restrito sees only this channel (and the ones open to everyone).
      - key: general
        type: text
        name: geral
        allow:
          - { role: restricted, permissions: [ViewChannel, ReadMessageHistory, SendMessages, SendMessagesInThreads] }
      - { key: off-topic,    type: text, name: off-topic }
      - { key: clips,        type: text, name: prints-e-clips }
      - { key: builds,       type: text, name: builds-e-equips, access: { asSoldier: [] } }
      - { key: event-alerts, type: text, name: eventos, access: { write: bot, asSoldier: [] } }
      - { key: agenda,       type: text, name: agenda,  access: { write: bot, asSoldier: [] } }
      - { key: news,         type: text, name: noticias, topic: "Notícias do Aion 2 (atualizações, manutenções, eventos e avisos), postadas pelo Padrinho assim que saem na Steam.", access: { write: bot, asSoldier: [] } }
      - { key: ranking,      type: text, name: ranking, topic: "Membros da legião por poder de combate, atualizado todo dia pelo Padrinho. Entra quem teve a ficha de recrutamento aprovada.", access: { write: bot, asSoldier: [] } }

  # Allied legions and the legion together: Aliado counts as Soldado, so view: soldier lets both
  # in and leaves Parceiro out.
  - key: alliance
    name: 🤝 ALIANÇA
    access: { view: soldier, write: soldier }
    channels:
      - { key: alliance-chat,  type: text,  name: alianca }
      - { key: alliance-voice, type: voice, name: Aliança }

  - key: knowledge
    name: 📚 CONHECIMENTO
    access: { view: soldier, write: soldier }
    channels:
      - key: tutorials
        type: forum
        name: tutoriais
        topic: Guias da legião. Qualquer membro pode postar — escolha pelo menos uma tag.
        requireTag: true
        tags:
          - { name: Gladiador, emoji: "⚔️" }
          - { name: Templário, emoji: "🛡️" }
          - { name: Assassino, emoji: "🗡️" }
          - { name: Arqueiro, emoji: "🏹" }
          - { name: Mago, emoji: "🔥" }
          - { name: Espiritualista, emoji: "👻" }
          - { name: Clérigo, emoji: "✨" }
          - { name: Encantador, emoji: "📿" }
          - { name: PvE }
          - { name: PvP }
          - { name: Abismo }
          - { name: Dungeon }
          - { name: Crafting }
          - { name: Iniciantes }

  # Fixed rooms everyone shares.
  - key: voice-rooms
    name: 🔊 SALAS GERAIS
    access: { view: soldier, write: soldier, asSoldier: [partner] }
    channels:
      - { key: general-voice, type: voice, name: Geral }
      - key: event-stage
        type: stage
        name: Evento
        access: { asSoldier: [] }
        # Stage moderators (who bring people up to speak) need Manage Channels on the stage.
        allow:
          - role: officer
            permissions: [ManageChannels, MuteMembers, MoveMembers]

  # One category per room type: its "➕ Criar" generator and the rooms it creates live together.
  - key: dungeon-rooms
    name: 🗝️ SALAS DUNGEON
    access: { view: soldier, write: soldier }
  - key: abyss-rooms
    name: ⚔️ SALAS ABISMO
    access: { view: soldier, write: soldier }
  - key: boss-rooms
    name: 🐉 SALAS BOSS
    access: { view: soldier, write: soldier }
  - key: social-rooms
    name: 🍻 SALAS SOCIAL
    access: { view: soldier, write: soldier, asSoldier: [partner] }

  - key: music
    name: 🎵 MÚSICA
    access: { view: soldier, write: none, asSoldier: [partner] }
    channels:
      - key: music
        type: text
        name: musica
        topic: "Só comandos de música: Jockie (m!p, m!s...) e Rythm (/play, /skip...). Outras mensagens são apagadas."
        # People write here only to type Jockie's m! commands; the music guard deletes the rest.
        access: { write: soldier }
        allowSlashCommands: soldier
        # Music bots post "now playing" here.
        allow:
          - role: bots
            permissions: [ViewChannel, SendMessages, EmbedLinks, ReadMessageHistory]

  - key: officers
    name: 🛡️ OFICIAIS
    access: { view: officer, write: officer }
    channels:
      - { key: officers,      type: text,  name: oficiais }
      # Only slash commands: nobody types here, the replies only the caller sees.
      - key: officer-commands
        type: text
        name: comandos
        topic: Use os comandos do Padrinho aqui (/member, /mod, /event...). Digite / para ver a lista.
        access: { write: none }
        allowSlashCommands: officer
      - { key: audit-log,     type: text,  name: audit-log, access: { write: bot } }
      - { key: meeting-voice, type: voice, name: Reunião }

  - key: afk
    name: 🌙 AFK
    access: { view: soldier, write: none, asSoldier: [partner] }
    channels:
      - { key: afk, type: voice, name: AFK }

# Bots (Jockie Music, Rythm, future ones) may join any voice channel and use its chat, so music
# commands work there too (temp rooms copy their generator's permissions).
voiceAccess:
  - role: bots
    allow: [ViewChannel, Connect, Speak, SendMessages, EmbedLinks, ReadMessageHistory]
    scope: all-voice

# Music commands only in #musica and in the voice channels' chat: every other text channel hides
# itself from the Bot role, so the music bots don't see (or answer) commands typed there. This needs
# the music bots' own integration roles without Administrator (Server Settings → Roles). To also
# hide their slash commands elsewhere, limit each bot in Server Settings → Integrations → Channels.
botTextChannels:
  role: bots
  channels: [music]

# Join-to-create generators (handled by Padrinho, no third-party bot). Each sits alone in its
# category, so the rooms it creates (Dungeon 01, 02...) stay grouped below it.
# nameTemplate: {n} is the lowest free number, zero-padded to 2 digits.
# userLimit: 0 = unlimited (99 is Discord's maximum).
voiceGenerators:
  - { key: gen-dungeon, category: dungeon-rooms, name: "➕ Criar", nameTemplate: "Dungeon {n}", userLimit: 5 }
  - { key: gen-abyss,   category: abyss-rooms,   name: "➕ Criar", nameTemplate: "Abismo {n}",  userLimit: 20 }
  - { key: gen-bosses,  category: boss-rooms,    name: "➕ Criar", nameTemplate: "Boss {n}",    userLimit: 20 }
  - { key: gen-social,  category: social-rooms,  name: "➕ Criar", nameTemplate: "Social {n}",  userLimit: 99 }

# Recurring events. Times are America/Sao_Paulo (Brasília).
# shugoEvent: id in https://shugo.gg/timers.json; days and time then follow it (settings.eventTimes).
# days: mon tue wed thu fri sat sun | daily
eventTemplates:
  - key: abyss-war
    title: Guerra do Abismo — Cerco de Artefatos
    emoji: "⚔️"
    days: [thu, sat]
    time: "21:00"
    shugoEvent: artifact-siege
    enabled: true
  - key: abyss-bosses
    title: Chefes do Cerco (Tamasa, Argo, Kairah)
    emoji: "👹"
    days: [thu, sat]
    time: "21:30"
    shugoEvent: siege-bosses
    enabled: true
  - key: weekly-boss-nahma
    title: Boss Semanal — Senhor Guardião Nahma
    emoji: "🐉"
    days: [fri, sun]
    time: "21:00"
    shugoEvent: guardian-nahma
    enabled: true

# Allied legions (/alliance add and /alliance remove write this list). Each gets a role named after
# the legion, above Aliado; `legion` is the name exactly as the game shows it.
alliances: []
