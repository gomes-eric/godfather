# Padrinho — declarative server layout for the M4F1A legion (Aion 2, Triniel LATAM, Asmodian).
# Applied with `/setup`. Keys are English; display names are PT-BR.
# Every item has a stable `key`: renaming `name` never recreates the Discord object.
#
# Access levels (minimum tier): everyone | soldier | officer | commander | bot | none
#   everyone  = @everyone (includes Visitante)
#   bot       = only Padrinho may write
#   none      = nobody may write (used by #musica; slash commands still allowed)

settings:
  botName: Padrinho
  locale: pt-BR
  timezone: America/Sao_Paulo   # South America servers use São Paulo time (shugo.gg)
  game:
    name: Aion 2
    server: Triniel
    region: LATAM
    faction: Asmodian
  community:
    enable: true
    rulesChannel: rules
    updatesChannel: officers
  afk:
    channel: afk
    timeoutSeconds: 900
  # Given and taken with /member partner (by Oficiais): friends who don't play.
  partnerRole: partner
  welcome:
    channel: welcome
    autoRole: visitor
    botRole: bots            # every bot that joins gets this role instead of autoRole
    # Posted as a card; {member} mentions the newcomer, {channel:<key>} becomes a link.
    title: 🌹 Bem-vindo(a) à M4F1A!
    message: |
      {member}, que bom ter você por aqui!
      Somos uma legião **Asmodiana** do **Triniel** (Aion 2 LATAM).
    steps:
      - name: 📜 Leia as regras
        value: Tudo começa em {channel:rules}.
      - name: 📝 Registre seu personagem
        value: Em {channel:role-picker}, digite o nome do seu personagem. Se você já está na M4F1A no jogo, vira Soldado na hora.
      - name: 🤝 Ainda não é da legião?
        value: Apresente-se em {channel:recruitment} e fale com um Oficial.
      - name: ❓ Ficou com dúvida?
        value: Pergunte em {channel:visitor-qa}, a gente responde.
  # Posted (and kept up to date) by /setup in #regras. {channel:<key>} becomes a clickable link.
  rules:
    channel: rules
    title: 📜 Regras da M4F1A
    message: |
      Bem-vindo(a) à **M4F1A**, legião Asmodiana do Triniel! 🌹
      Estas regras valem aqui no Discord **e** dentro do jogo. Ao ficar no servidor, você concorda com elas.

      ━━━━━━━━━━━━━━━━━━━━━━

      🤝 **1 · Respeito acima de tudo**
      Sem ofensas, preconceito, assédio ou provocação, seja com membros, aliados ou inimigos. Brincadeira só vale se todo mundo estiver rindo.

      ⚔️ **2 · A legião vem primeiro**
      Na Guerra do Abismo, nos Chefes e nos eventos, siga a call dos Oficiais. Confirme presença nos botões dos avisos em {channel:event-alerts} e avise se não puder ir.

      🎯 **3 · Compromisso com a atividade**
      Participe dos eventos sempre que puder. Ficar muito tempo inativo sem avisar pode levar à remoção da legião no jogo.

      💰 **4 · Loot e drops**
      Siga as regras de distribuição combinadas pelos Oficiais. Nada de pegar item fora da sua vez.

      🗂️ **5 · Cada coisa no seu canal**
      💬 Conversa em {channel:general} · 🎵 música só em {channel:music} (comandos `/`) · 📚 guias em {channel:tutorials} · 📸 prints em {channel:clips}

      🚫 **6 · Sem spam, divulgação ou golpes**
      Nada de flood, links suspeitos, venda de contas/gold ou propaganda de outros servidores.

      🔞 **7 · Conteúdo adequado**
      Nada de NSFW, gore ou qualquer coisa que viole os termos do Discord ou do Aion 2.

      🛡️ **8 · Problemas? Fale com um Oficial**
      Discussão se resolve no privado com a liderança, não no chat. Denúncias são tratadas com sigilo.

      ━━━━━━━━━━━━━━━━━━━━━━

      ⚖️ **Punições**
      Conforme a gravidade: aviso → timeout → expulsão do Discord e da legião. Casos graves vão direto para o banimento.

      📝 Registre seu personagem em {channel:role-picker} · 📅 Veja a semana em {channel:agenda}
  # Nobody changes their own nickname by hand: #registro sets it (Comandantes are not affected).
  lockNicknames: true
  # The game's patch notes, read from its Steam announcements (in Portuguese) every 15 minutes.
  patchNotes:
    channel: patch-notes
    steamAppId: 3393110       # AION 2 on Steam
    titleMatches: ["Notas da Atualização", "Patch Notes"]
  # Characters are read from the official Aion 2 site (the same data shugo.gg shows).
  # Triniel (South America, Asmodian side) is server 2403.
  characters:
    region: la
    serverId: 2403
    # In the legion in-game → #registro makes them Soldado; otherwise it points to recruitment.
    # (The site shows only the legion's name, not the in-game rank: Oficiais are promoted by hand.)
    legion: M4F1A
    recruitmentChannel: recruitment
  # #registro panel: in-game name → class (read from the game) and nickname "⚔️ Nome".
  rolePicker:
    channel: role-picker
  audit:
    channel: audit-log
  musicGuard:
    channel: music
    # Jockie Music reads text commands (m!p, m!s...); messages starting with these stay.
    commandPrefixes: ["m!"]
  # Safety net for the ➕ Criar generators: new rooms per minute for the whole server (0 = no limit).
  # There is no per-person wait; leaving a room to create another just swaps them.
  voiceRooms:
    maxCreationsPerMinute: 30
  eventDefaults:
    announceChannel: event-alerts
    agendaChannel: agenda
    reminderOffsetsMinutes: [30, 0]
    ping: everyone

roles:
  # Asmodian palette: blood crimson, abyss violet, ash and steel.
  # Colors are mid-tone so names stay readable on Discord's dark theme.
  # Hierarchy (top to bottom). The bot's own role must sit above all of these.
  - key: commander
    name: Comandante
    tier: commander
    color: "#E0303A"   # Asmodian crimson
    hoist: true
    permissions: [Administrator]
  - key: officer
    name: Oficial
    tier: officer
    maxMembers: 4
    color: "#A855F7"   # abyss violet
    hoist: true
    permissions: [KickMembers, ModerateMembers, ManageMessages, ManageThreads, MoveMembers, MuteMembers]
  - key: soldier
    name: Soldado
    tier: soldier
    color: "#8B7FB8"   # dusk lavender
    hoist: true
  # Friends who don't play: they chat and hang out in voice, outside the tier ladder.
  # Channels let them in with access.asSoldier.
  - key: partner
    name: Parceiro
    color: "#C98A6B"   # copper
    hoist: true
  - key: visitor
    name: Visitante
    tier: visitor
    color: "#7D7A8C"   # ash
  # Shared role for every third-party bot (Jockie Music, Rythm, future ones).
  # Padrinho assigns it automatically to any bot that joins.
  - key: bots
    name: Bot
    color: "#6E7F99"   # steel
    hoist: true
  # Classes (self-assigned via buttons in #classes).
  # Colors follow the in-game class icons (sampled from https://sistersofmercy.altervista.org/classes/):
  # Guerreiro = blue, Batedor = green, Mago = purple, Sacerdote = pale gold.
  # Each pair uses a deeper and a lighter shade so the two classes stay distinct.
  - { key: class-gladiator,   name: Gladiador,      class: true, archetype: warrior, emoji: "⚔️", color: "#6EC6F5" }  # sky blue
  - { key: class-templar,     name: Templário,      class: true, archetype: warrior, emoji: "🛡️", color: "#4A7BD0" }  # deep blue
  - { key: class-assassin,    name: Assassino,      class: true, archetype: scout,   emoji: "🗡️", color: "#4FB286" }  # emerald
  - { key: class-ranger,      name: Arqueiro,       class: true, archetype: scout,   emoji: "🏹", color: "#8EF5B7" }  # mint
  - { key: class-sorcerer,    name: Mago,           class: true, archetype: mage,    emoji: "🔥", color: "#D291EF" }  # lilac
  - { key: class-spiritmaster, name: Espiritualista, class: true, archetype: mage,   emoji: "👻", color: "#9B59D0" }  # deep purple
  - { key: class-cleric,      name: Clérigo,        class: true, archetype: priest,  emoji: "✨", color: "#E6C46A" }  # gold
  - { key: class-chanter,     name: Encantador,     class: true, archetype: priest,  emoji: "📿", color: "#EEE6A8" }  # cream

categories:
  - key: info
    name: 📜 INFORMAÇÕES
    access: { view: everyone, write: bot }
    channels:
      - { key: rules,       type: text, name: regras }
      - { key: announcements, type: announcement, name: anuncios, access: { write: officer } }
      - { key: welcome,     type: text, name: boas-vindas }
      - { key: role-picker, type: text, name: registro }

  - key: recruitment
    name: 🤝 RECRUTAMENTO
    access: { view: everyone, write: everyone }
    channels:
      - { key: recruitment, type: text, name: recrutamento }
      - { key: visitor-qa,  type: text, name: duvidas-visitantes }

  # asSoldier: roles that get what Soldado gets here; a channel's [] leaves them out.
  - key: legion
    name: 📣 M4F1A
    access: { view: soldier, write: soldier, asSoldier: [partner] }
    channels:
      - { key: general,      type: text, name: geral }
      - { key: off-topic,    type: text, name: off-topic }
      - { key: clips,        type: text, name: prints-e-clips }
      - { key: builds,       type: text, name: builds-e-equips, access: { asSoldier: [] } }
      - { key: event-alerts, type: text, name: eventos, access: { write: bot, asSoldier: [] } }
      - { key: agenda,       type: text, name: agenda,  access: { write: bot, asSoldier: [] } }
      - { key: patch-notes,  type: text, name: patch-notes, topic: "Notas de atualização do Aion 2, postadas pelo Padrinho assim que saem na Steam.", access: { write: bot, asSoldier: [] } }

  - key: knowledge
    name: 📚 CONHECIMENTO
    access: { view: soldier, write: soldier }
    channels:
      - key: tutorials
        type: forum
        name: tutoriais
        topic: Guias da legião. Qualquer membro pode postar — escolha pelo menos uma tag.
        requireTag: true
        tags:
          - { name: Gladiador, emoji: "⚔️" }
          - { name: Templário, emoji: "🛡️" }
          - { name: Assassino, emoji: "🗡️" }
          - { name: Arqueiro, emoji: "🏹" }
          - { name: Mago, emoji: "🔥" }
          - { name: Espiritualista, emoji: "👻" }
          - { name: Clérigo, emoji: "✨" }
          - { name: Encantador, emoji: "📿" }
          - { name: PvE }
          - { name: PvP }
          - { name: Abismo }
          - { name: Dungeon }
          - { name: Crafting }
          - { name: Iniciantes }

  # Fixed rooms everyone shares.
  - key: voice-rooms
    name: 🔊 SALAS GERAIS
    access: { view: soldier, write: soldier, asSoldier: [partner] }
    channels:
      - { key: general-voice, type: voice, name: Geral }
      - key: event-stage
        type: stage
        name: Evento
        access: { asSoldier: [] }
        # Stage moderators (who bring people up to speak) need Manage Channels on the stage.
        allow:
          - role: officer
            permissions: [ManageChannels, MuteMembers, MoveMembers]

  # One category per room type: its "➕ Criar" generator and the rooms it creates live together.
  - key: dungeon-rooms
    name: 🗝️ SALAS DUNGEON
    access: { view: soldier, write: soldier }
  - key: abyss-rooms
    name: ⚔️ SALAS ABISMO
    access: { view: soldier, write: soldier }
  - key: boss-rooms
    name: 🐉 SALAS BOSS
    access: { view: soldier, write: soldier }
  - key: social-rooms
    name: 🍻 SALAS SOCIAL
    access: { view: soldier, write: soldier, asSoldier: [partner] }

  - key: music
    name: 🎵 MÚSICA
    access: { view: soldier, write: none, asSoldier: [partner] }
    channels:
      - key: music
        type: text
        name: musica
        topic: "Só comandos de música: Jockie (m!p, m!s...) e Rythm (/play, /skip...). Outras mensagens são apagadas."
        # People write here only to type Jockie's m! commands; the music guard deletes the rest.
        access: { write: soldier }
        allowSlashCommands: soldier
        # Music bots post "now playing" here.
        allow:
          - role: bots
            permissions: [ViewChannel, SendMessages, EmbedLinks, ReadMessageHistory]

  - key: officers
    name: 🛡️ OFICIAIS
    access: { view: officer, write: officer }
    channels:
      - { key: officers,      type: text,  name: oficiais }
      # Only slash commands: nobody types here, the replies only the caller sees.
      - key: officer-commands
        type: text
        name: comandos
        topic: Use os comandos do Padrinho aqui (/member, /mod, /event...). Digite / para ver a lista.
        access: { write: none }
        allowSlashCommands: officer
      - { key: audit-log,     type: text,  name: audit-log, access: { write: bot } }
      - { key: meeting-voice, type: voice, name: Reunião }

  - key: afk
    name: 🌙 AFK
    access: { view: soldier, write: none, asSoldier: [partner] }
    channels:
      - { key: afk, type: voice, name: AFK }

# Bots (Jockie Music, Rythm, future ones) may join any voice channel.
# Restricting the music bots' slash commands to #musica is a manual step (Server Settings → Integrations).
voiceAccess:
  - role: bots
    allow: [ViewChannel, Connect, Speak]
    scope: all-voice

# Join-to-create generators (handled by Padrinho, no third-party bot). Each sits alone in its
# category, so the rooms it creates (Dungeon 01, 02...) stay grouped below it.
# nameTemplate: {n} is the lowest free number, zero-padded to 2 digits.
# userLimit: 0 = unlimited (99 is Discord's maximum).
voiceGenerators:
  - { key: gen-dungeon, category: dungeon-rooms, name: "➕ Criar", nameTemplate: "Dungeon {n}", userLimit: 5 }
  - { key: gen-abyss,   category: abyss-rooms,   name: "➕ Criar", nameTemplate: "Abismo {n}",  userLimit: 20 }
  - { key: gen-bosses,  category: boss-rooms,    name: "➕ Criar", nameTemplate: "Boss {n}",    userLimit: 20 }
  - { key: gen-social,  category: social-rooms,  name: "➕ Criar", nameTemplate: "Social {n}",  userLimit: 99 }

# Recurring events. Times are America/Sao_Paulo (Brasília).
# Verified against https://shugo.gg/pt-br/timers (South America) on 2026-10-25.
# days: mon tue wed thu fri sat sun | daily
eventTemplates:
  - key: abyss-war
    title: Guerra do Abismo — Cerco de Artefatos
    emoji: "⚔️"
    days: [mon, thu, sat]
    time: "21:00"
    enabled: true
  - key: abyss-bosses
    title: Chefes do Cerco (Tamasa, Argo, Kairah)
    emoji: "👹"
    days: [mon, thu, sat]
    time: "21:30"
    enabled: true
  - key: weekly-boss-nahma
    title: Boss Semanal — Senhor Guardião Nahma
    emoji: "🐉"
    days: [fri, sun]
    time: "21:00"
    enabled: true

# Respawn-based field bosses (no fixed clock time; see PLAN.md §6.11).
# Respawn times come from the questlog.gg feed, with manual/AI overrides taking precedence.
# questlogId: Asmodian versions only (Altgard = 1110xx; the 1010xx ids are the Elyos versions).
fieldBosses:
  source:
    provider: questlog
    enabled: true            # set to false if questlog.gg objects or the endpoint breaks; manual /boss still works
    serverId: 2403           # Triniel (South America)
    pollIntervalSeconds: 180
    staleAfterHours: 6       # older readings trigger a warning in #audit-log
  reminderOffsetsMinutes: [30, 0]
  bosses:
    - key: gartua
      title: Boss Diário — Gartua Imortal
      emoji: "💀"
      region: Altgard
      level: 51
      questlogId: 111021
      respawnMinutes: null   # unknown; required only for `/boss killed` (learned later)
      enabled: true
    - key: lagta
      title: Boss Diário — Brigadeiro Lagta
      emoji: "💀"
      region: Altgard
      level: 48
      questlogId: 111022
      respawnMinutes: null
      enabled: true
