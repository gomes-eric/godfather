services:
  padrinho:
    build: .
    image: padrinho:latest
    restart: unless-stopped
    mem_limit: 384m
    env_file: .env
    # The bot writes server.yaml (event times from shugo.gg, /event template edit). On the server
    # the file belongs to the deploy user (mode 664): joining that user's group lets the
    # container's node user write it without changing its owner, so git pulls still work.
    group_add:
      - '${HOST_GID:-1001}'
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/padrinho.db
      SERVER_CONFIG_PATH: /app/server.yaml
    volumes:
      - ./data:/data
      - ./server.yaml:/app/server.yaml
    ports:
      - '127.0.0.1:8080:8080'
